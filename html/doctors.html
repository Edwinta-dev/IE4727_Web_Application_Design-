<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Doctors - Wong & Lim Clinic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        
        nav {
            background-color: white;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #1a3a5c;
            text-decoration: none;
        }
        
        .nav-links {
            float: right;
            margin-top: 10px;
        }
        
        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: #333;
        }
        
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .doctor-card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .doctor-card img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        
        .doctor-card h3 {
            color: #1a3a5c;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .doctor-card p {
            color: #2563eb;
            font-size: 18px;
            margin-bottom: 20px;
        }
        
        .btn-view {
            display: inline-block;
            padding: 12px 30px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Wong & Lim Clinic</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="doctors.html">Doctors</a>
            <a href="about.html">About</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="hero">
        <h1>Meet Our Doctors</h1>
        <p>Expert dental care from our qualified team</p>
    </div>

    <div class="container">
        <!-- Doctor 1 -->
        <div class="doctor-card">
            <img src="https://via.placeholder.com/200?text=Dr.+Sarah" alt="Dr. Sarah Wong">
            <h3>Dr. Sarah Wong</h3>
            <p>Cosmetic Dentistry</p>
            <a href="doctor-profile.html" class="btn-view">View Profile</a>
        </div>

        <!-- Doctor 2 -->
        <div class="doctor-card">
            <img src="https://via.placeholder.com/200?text=Dr.+James" alt="Dr. James Lim">
            <h3>Dr. James Lim</h3>
            <p>Pediatric Dentistry</p>
            <a href="doctor-profile.html" class="btn-view">View Profile</a>
        </div>

        <!-- Doctor 3 -->
        <div class="doctor-card">
            <img src="https://via.placeholder.com/200?text=Dr.+Emily" alt="Dr. Emily Tan">
            <h3>Dr. Emily Tan</h3>
            <p>Oral Surgery</p>
            <a href="doctor-profile.html" class="btn-view">View Profile</a>
        </div>
    </div>

</body>
</html>
