<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wong & Lim Clinic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        nav {
            background-color: white;
            padding: 20px 50px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #1a3a5c;
            text-align: center;
        }

        .login-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 50px 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        h2 {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .switch-form {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 15px;
        }

        .switch-form a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .switch-form a:hover {
            color: #764ba2;
        }

        .user-type {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .user-type label {
            flex: 1;
            text-align: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 0;
            font-weight: 600;
            transition: all 0.3s;
        }

        .user-type input[type="radio"]:checked + label {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .user-type input[type="radio"] {
            display: none;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Wong & Lim Clinic</div>
    </nav>

    <div class="login-container">
        <h2>Login to Your Account</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label>I am a:</label>
                <div class="user-type">
                    <input type="radio" id="patient" name="usertype" value="patient" checked>
                    <label for="patient">Patient</label>
                    
                    <input type="radio" id="doctor" name="usertype" value="doctor">
                    <label for="doctor">Doctor</label>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="switch-form">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const userType = document.querySelector('input[name="usertype"]:checked').value;
            
            if(userType === 'patient') {
                alert('Logging in as Patient...');
                window.location.href = 'patient-dashboard.html';
            } else {
                alert('Logging in as Doctor...');
                window.location.href = 'doctor-dashboard.html';
            }
        });
    </script>

</body>
</html>
